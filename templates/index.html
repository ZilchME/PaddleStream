<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamASR Web客户端</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h1>StreamASR 语音识别</h1>
    <div>
        <button id="startBtn">开始录音</button>
        <button id="stopBtn" disabled>停止录音</button>
    </div>
    <div id="results">
        <h3>识别结果：</h3>
        <div id="partialResult" style="color: gray;"></div>
        <div id="finalResult" style="color: black; font-weight: bold;"></div>
    </div>

    <script>
        // 从服务器动态获取Socket.IO路径配置
        const socketPath = '{{ socketio_path }}';
        const serverHost = '{{ server_host }}';
        const serverPort = '{{ server_port }}';
        
        // 连接到Socket.IO服务器
        const socket = io(`http://${serverHost === '0.0.0.0' ? 'localhost' : serverHost}:${serverPort}`, {
            path: socketPath,
            transports: ['websocket', 'polling']
        });

        console.log('连接配置:', {
            socketPath: socketPath,
            serverHost: serverHost,
            serverPort: serverPort
        });

        let mediaRecorder;
        let isRecording = false;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const partialResult = document.getElementById('partialResult');
        const finalResult = document.getElementById('finalResult');

        // Socket.IO 事件处理
        socket.on('connect', () => {
            console.log('连接成功:', socket.id);
        });

        socket.on('connected', (data) => {
            console.log('会话已建立:', data.session_id);
        });

        socket.on('asr_started', (data) => {
            console.log('ASR已启动:', data.session_id);
        });

        socket.on('asr_partial_result', (data) => {
            console.log('部分结果:', data.result);
            partialResult.textContent = data.result;
        });

        socket.on('asr_result', (data) => {
            console.log('最终结果:', data.result);
            finalResult.textContent = data.result;
            partialResult.textContent = '';
        });

        socket.on('asr_error', (data) => {
            console.error('ASR错误:', data.error);
            alert('ASR错误: ' + data.error);
        });

        socket.on('error', (data) => {
            console.error('错误:', data.message);
            alert('错误: ' + data.message);
        });

        // 开始录音
        startBtn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm;codecs=opus'
                });

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        const reader = new FileReader();
                        reader.onload = () => {
                            const arrayBuffer = reader.result;
                            const audioData = new Int16Array(arrayBuffer);
                            socket.emit('audio_data', {
                                audio: Array.from(audioData)
                            });
                        };
                        reader.readAsArrayBuffer(event.data);
                    }
                };

                mediaRecorder.start(100); // 每100ms发送一次数据
                socket.emit('start_asr');
                
                isRecording = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;
                
                console.log('录音已开始');
            } catch (error) {
                console.error('获取麦克风权限失败:', error);
                alert('获取麦克风权限失败');
            }
        });

        // 停止录音
        stopBtn.addEventListener('click', () => {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                socket.emit('stop_asr');
                
                isRecording = false;
                startBtn.disabled = false;
                stopBtn.disabled = true;
                
                console.log('录音已停止');
            }
        });
    </script>
</body>
</html>
